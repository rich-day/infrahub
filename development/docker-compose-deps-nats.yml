---
# yamllint disable rule:line-length
services:
  message-queue:
    profiles: [demo, dev]
    image: "${MESSAGE_QUEUE_DOCKER_IMAGE:-nats:alpine}"  # need alpine since latest is based on scratch (no wget available)
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf
    healthcheck:
      test: wget -O /dev/null http://localhost:8222/varz || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  # This is actually unused but required to not break all the other compose files requiring this service...
  cache:
    profiles: [demo, dev]
    image: "${MESSAGE_QUEUE_DOCKER_IMAGE:-nats:alpine}"
    healthcheck:
      test: wget -O /dev/null http://localhost:8222/varz || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  task-manager-init:
    profiles: [demo, dev]
    image: "${IMAGE_NAME}:${IMAGE_VER}"
    command: "python -m infrahub.prefect_server.bootstrap"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@task-manager-db:5432/prefect
    depends_on:
      task-manager-db:
        condition: service_healthy
      cache:
        condition: service_healthy
  task-manager:
    profiles: [demo, dev]
    image: "${IMAGE_NAME}:${IMAGE_VER}"
    command: "${PREFECT_SERVER_COMMAND:-gunicorn -k uvicorn.workers.UvicornWorker -b 0.0.0.0:4200 'infrahub.prefect_server.app:create_infrahub_prefect()}"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@task-manager-db:5432/prefect
      PREFECT_LOCAL_STORAGE_PATH: ${PREFECT_LOCAL_STORAGE_PATH:-/opt/prefect/}
      PREFECT__SERVER_WEBSERVER_ONLY: "true"

      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: "${INFRAHUB_CACHE_ADDRESS:-cache}"
      PREFECT_REDIS_MESSAGING_DB: "1"
      WEB_CONCURRENCY: ${TASK_MANAGER_API_WORKERS:-2}
    healthcheck:
      test: /usr/local/bin/httpx http://localhost:4200/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      task-manager-init:
        condition: service_completed_successfully
      task-manager-db:
        condition: service_healthy
      cache:
        condition: service_healthy
    labels:
      namespace: "prefect"
      pod: "prefect-server"
  task-manager-background-svc:
    profiles: [demo, dev]
    image: "${IMAGE_NAME}:${IMAGE_VER}"
    command: prefect server services start
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@task-manager-db:5432/prefect
      PREFECT_LOCAL_STORAGE_PATH: ${PREFECT_LOCAL_STORAGE_PATH:-/opt/prefect/}

      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: "${INFRAHUB_CACHE_ADDRESS:-cache}"
      PREFECT_REDIS_MESSAGING_DB: "1"
    depends_on:
      task-manager:
        condition: service_healthy
      task-manager-db:
        condition: service_healthy
      cache:
        condition: service_healthy
    labels:
      namespace: "prefect"
      pod: "prefect-server-background-services"
  task-manager-db:
    profiles: [demo, dev]
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=prefect
    volumes:
      - workflow_db:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -q -d ${INFRAHUB_TASKMANAGER_DB_DATABASE:-prefect} -U ${INFRAHUB_TASKMANAGER_DB_USER:-postgres}"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  workflow_db:
