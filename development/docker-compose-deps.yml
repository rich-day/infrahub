# yamllint disable rule:line-length
---
services:
  message-queue:
    profiles: [demo, dev]
    user: rabbitmq
    image: "${MESSAGE_QUEUE_DOCKER_IMAGE:-rabbitmq:3.13.7-management}"
    environment:
      - "RABBITMQ_DEFAULT_USER=infrahub"
      - "RABBITMQ_DEFAULT_PASS=infrahub"
    healthcheck:
      test: rabbitmq-diagnostics -q check_port_connectivity
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 3s
  cache:
    profiles: [demo, dev]
    image: "${CACHE_DOCKER_IMAGE:-redis:7.2.4}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 3
  task-manager-init:
    profiles: [demo, dev]
    image: "${IMAGE_NAME}:${IMAGE_VER}"
    command: "python -m infrahub.prefect_server.bootstrap"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@task-manager-db:5432/prefect
    depends_on:
      task-manager-db:
        condition: service_healthy
      cache:
        condition: service_healthy
  task-manager:
    profiles: [demo, dev]
    image: "${IMAGE_NAME}:${IMAGE_VER}"
    command: "${PREFECT_SERVER_COMMAND:-gunicorn -k uvicorn.workers.UvicornWorker -b 0.0.0.0:4200 'infrahub.prefect_server.app:create_infrahub_prefect()}"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@task-manager-db:5432/prefect
      PREFECT_LOCAL_STORAGE_PATH: ${PREFECT_LOCAL_STORAGE_PATH:-/opt/prefect/}
      PREFECT__SERVER_WEBSERVER_ONLY: "true"

      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: "${INFRAHUB_CACHE_ADDRESS:-cache}"
      PREFECT_REDIS_MESSAGING_DB: "1"
      WEB_CONCURRENCY: ${TASK_MANAGER_API_WORKERS:-2}
    healthcheck:
      test: /usr/local/bin/httpx http://localhost:4200/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      task-manager-init:
        condition: service_completed_successfully
      task-manager-db:
        condition: service_healthy
      cache:
        condition: service_healthy
    labels:
      namespace: "prefect"
      pod: "prefect-server"
  task-manager-background-svc:
    profiles: [demo, dev]
    image: "${IMAGE_NAME}:${IMAGE_VER}"
    command: prefect server services start
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@task-manager-db:5432/prefect
      PREFECT_LOCAL_STORAGE_PATH: ${PREFECT_LOCAL_STORAGE_PATH:-/opt/prefect/}

      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: "${INFRAHUB_CACHE_ADDRESS:-cache}"
      PREFECT_REDIS_MESSAGING_DB: "1"
    depends_on:
      task-manager:
        condition: service_healthy
      task-manager-db:
        condition: service_healthy
      cache:
        condition: service_healthy
    labels:
      namespace: "prefect"
      pod: "prefect-server-background-services"
  task-manager-db:
    profiles: [demo, dev]
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=prefect
    volumes:
      - workflow_db:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -q -d ${INFRAHUB_TASKMANAGER_DB_DATABASE:-prefect} -U ${INFRAHUB_TASKMANAGER_DB_USER:-postgres}"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  workflow_db:
